# A data-only Python package: it ships dist/kubu.min.css and css/ as static files for Django or
# Flask. There is no Python API. Build with:  python -m build   (from kubu-framework/)
[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "kubu-css"
version = "2.0.0"
description = "KUBU: one CSS file for server-rendered HTML, as static files for Django and Flask."
readme = "python/README.md"
license = "MIT"
authors = [{ name = "Khotso Tsoaela" }]
requires-python = ">=3.8"
keywords = ["css", "framework", "django", "flask", "htmx", "bem", "dark-mode"]
classifiers = [
    "Framework :: Django",
    "Framework :: Flask",
    "Topic :: Software Development :: User Interfaces",
]

[project.urls]
Homepage = "https://github.com/ktsoaela/KUBU"
Issues = "https://github.com/ktsoaela/KUBU/issues"

[tool.hatch.build.targets.wheel]
packages = ["python/kubu_css"]

[tool.hatch.build.targets.wheel.force-include]
"dist/kubu.min.css" = "kubu_css/static/kubu/kubu.min.css"
"dist/kubu.css" = "kubu_css/static/kubu/kubu.css"
"css" = "kubu_css/static/kubu/css"
"img/icons.svg" = "kubu_css/static/kubu/img/icons.svg"

[tool.hatch.build.targets.sdist]
include = ["python", "dist/kubu.min.css", "dist/kubu.css", "css", "img/icons.svg", "pyproject.toml"]
