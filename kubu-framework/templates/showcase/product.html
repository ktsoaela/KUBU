<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Victoria blanket · Basotho Crafts</title>
    <link rel="icon" href="../../img/hippo-black.svg">
    <link rel="stylesheet" href="../../styles.css">
    <script>try { var t = localStorage.getItem('kubu-theme'); if (t) document.documentElement.dataset.theme = t; } catch (e) {}</script>
</head>
<body>
<main class="container section">
    <header class="header">
        <nav class="navbar" aria-label="Shop">
            <a class="logo" href="storefront.html"><svg class="icon" aria-hidden="true"><use href="../../img/icons.svg#hippo"></use></svg> Basotho Crafts</a>
            <ul class="navbar-nav">
                <li class="nav-item"><a class="nav-link" href="storefront.html">Shop</a></li>
                <li class="nav-item"><a class="nav-link" href="product.html" aria-current="page">Blankets</a></li>
                <li class="nav-item"><a class="nav-link" href="contact.html">Contact</a></li>
                <li class="nav-item"><a class="nav-link" href="about.html">About</a></li>
                <li class="nav-item"><a class="nav-link" href="dashboard.html">Desk</a></li>
            </ul>
        </nav>
    </header>
    <nav aria-label="Breadcrumb">
        <ol class="breadcrumb">
            <li class="breadcrumb__item"><a class="breadcrumb__link" href="storefront.html">Home</a></li>
            <li class="breadcrumb__item breadcrumb__item--active" aria-current="page">Victoria blanket</li>
        </ol>
    </nav>
    <div class="grid">
        <section class="col-12 md:col-6">
            <img src="../../img/hippo-black.svg" alt="The blanket folded" width="160" height="160">
        </section>
        <div class="col-12 md:col-6">
            <h1 class="title">Victoria blanket <span class="badge badge--safe">In stock</span></h1>
            <p><strong>R 1 450.00</strong> including VAT.</p>
            <p>4.6 out of 5 from 38 reviews.</p>
            <form action="product.html" method="get">
                <div class="form-group">
                    <label class="form-label" for="sc-colour">Colour</label>
                    <select class="form-select" id="sc-colour" name="colour">
                        <option>Red and gold</option>
                        <option>Blue and white</option>
                    </select>
                </div>
                <button class="button button--primary" type="submit">Add to cart</button>
            </form>
        </div>
    </div>
    <div class="tabs" role="group" aria-label="Blanket details">
        <input class="tabs__input" type="radio" name="sc-product" id="sc-about" checked>
        <label class="tabs__tab" for="sc-about">About</label>
        <div class="tabs__panel"><p>The crown pattern, first woven for a royal visit in 1947.</p></div>
        <input class="tabs__input" type="radio" name="sc-product" id="sc-care">
        <label class="tabs__tab" for="sc-care">Care</label>
        <div class="tabs__panel"><p>Air it in the shade. Do not machine wash.</p></div>
    </div>
</main>
</body>
</html>
